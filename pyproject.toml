[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexorai-smart-auto"
version = "0.1.0"
description = "Portable memory and Auto model routing utilities for NexorAI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mongodb = ["pymongo>=4.6"]
crypto = ["cryptography>=43.0"]
mcp = ["mcp>=2.0,<3; python_version >= '3.11'"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
nexor-vault = "SmartMemory.cli:main"
nexor-vault-mcp = "SmartMemory.mcp_server:main"
nexor-vault-api = "SmartMemory.api:main"

[tool.setuptools]
packages = ["SmartMemory"]
