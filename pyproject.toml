[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memty"
version = "0.2.0"
description = "Memty: portable memory, smart model routing, and multi-provider chat"
readme = "memty/README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["memty", "portable-memory", "vector-memory", "model-routing", "linucb", "mcp", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/RohanNK86/memty"
Documentation = "https://github.com/RohanNK86/memty/tree/main/memty"

[project.optional-dependencies]
mongodb = ["pymongo>=4.6"]
crypto = ["cryptography>=43.0"]
mcp = ["mcp>=2.0,<3; python_version >= '3.11'"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
memty = "memty.cli:main"
memty-mcp = "memty.mcp_server:main"
memty-legacy-vault = "memty.legacy_vault:main"
memty-legacy-mcp = "memty.legacy_mcp:main"
memty-api = "memty.api:main"
memty-router-mcp = "memty.router_mcp:main"

[tool.setuptools]
packages = ["memty", "memoryport"]
