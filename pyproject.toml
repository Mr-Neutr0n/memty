[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexorai-smart-auto"
version = "0.2.0"
description = "MemoryPort: local model routing, vector memory, multi-provider chat, and a portable Python vault"
readme = "memoryport/README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["memoryport", "portable-memory", "vector-memory", "model-routing", "linucb", "mcp", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/RohanNK86/Open_AI_Bot"
Documentation = "https://github.com/RohanNK86/Open_AI_Bot/tree/main/MemoryPort"

[project.optional-dependencies]
mongodb = ["pymongo>=4.6"]
crypto = ["cryptography>=43.0"]
mcp = ["mcp>=2.0,<3; python_version >= '3.11'"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
memty = "memty.cli:main"
memty-mcp = "memty.mcp_server:main"
nexor-vault = "memoryport.cli:main"
nexor-vault-mcp = "memoryport.mcp_server:main"
nexor-vault-api = "memoryport.api:main"
nexorai = "memoryport.sdk_cli:main"
nexorai-mcp = "memoryport.sdk_mcp:main"

[tool.setuptools]
packages = ["memty", "memoryport", "nexorai"]
