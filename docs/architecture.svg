<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Memty architecture</title>
  <desc id="desc">The browser uses the Next.js web application. The Next.js chat route connects to model providers and proxies trusted account and memory requests to the Express backend. The backend stores account, conversation, memory, and usage data in MongoDB, and can optionally connect to the Python Memory Vault.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7c8aa8"/>
    </marker>
    <style>
      .title{font:700 27px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f6ff}
      .subtitle{font:14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#aeb9d1}
      .head{font:700 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f6ff}
      .label{font:13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#c6cfe2}
      .small{font:12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#95a3bf}
      .box{fill:#1c2540;stroke:#3a4768;stroke-width:1.5}
      .optional{fill:#151d32;stroke:#7583a6;stroke-width:1.5;stroke-dasharray:7 6}
      .line{fill:none;stroke:#7c8aa8;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="180" fill="#4f46e5" opacity=".08"/>
  <circle cx="110" cy="520" r="190" fill="#06b6d4" opacity=".06"/>
  <text x="54" y="62" class="title">Memty · system map</text>
  <text x="54" y="88" class="subtitle">A web workspace, provider adapters, account services, and an optional portable memory vault</text>

  <rect x="54" y="232" width="190" height="132" rx="18" class="box"/>
  <text x="78" y="273" class="head">Browser</text>
  <text x="78" y="301" class="label">Chat workspace</text>
  <text x="78" y="324" class="label">Memory dashboard</text>
  <text x="78" y="347" class="small">Next.js UI</text>

  <rect x="328" y="194" width="250" height="208" rx="18" fill="#20294a" stroke="url(#accent)" stroke-width="2"/>
  <text x="354" y="235" class="head">Next.js app</text>
  <text x="354" y="265" class="label">Pages and API routes</text>
  <text x="354" y="289" class="label">Chat orchestration</text>
  <text x="354" y="313" class="label">Model adapters + Auto</text>
  <text x="354" y="337" class="label">Private backend proxy</text>
  <text x="354" y="372" class="small">Port 3001 · app/ · providers/</text>

  <rect x="686" y="86" width="230" height="136" rx="18" class="box"/>
  <text x="712" y="128" class="head">Model providers</text>
  <text x="712" y="157" class="label">Gemini · Claude · Grok</text>
  <text x="712" y="181" class="label">Kimi · OpenRouter models</text>
  <text x="712" y="204" class="small">Only configured models are available</text>

  <rect x="686" y="289" width="230" height="150" rx="18" class="box"/>
  <text x="712" y="331" class="head">Express backend</text>
  <text x="712" y="360" class="label">Sessions · API · memory</text>
  <text x="712" y="384" class="label">Conversation and usage data</text>
  <text x="712" y="418" class="small">Port 3002 · backend/</text>

  <rect x="1000" y="258" width="154" height="174" rx="18" class="box"/>
  <text x="1022" y="300" class="head">MongoDB</text>
  <text x="1022" y="331" class="label">Users</text>
  <text x="1022" y="355" class="label">Memories</text>
  <text x="1022" y="379" class="label">Conversations</text>
  <text x="1022" y="403" class="label">Usage</text>

  <rect x="686" y="488" width="230" height="90" rx="18" class="optional"/>
  <text x="712" y="524" class="head">Python Memory Vault</text>
  <text x="712" y="551" class="label">Optional · SQLite or MongoDB</text>
  <text x="712" y="570" class="small">memty/ · private API</text>

  <path d="M244 298H318" class="line"/>
  <path d="M578 250C620 250 635 155 676 155" class="line"/>
  <path d="M578 345H676" class="line"/>
  <path d="M916 364H990" class="line"/>
  <path d="M801 448V478" class="line"/>
  <text x="257" y="284" class="small">HTTPS</text>
  <text x="603" y="218" class="small">chat request</text>
  <text x="603" y="333" class="small">trusted proxy</text>
  <text x="929" y="350" class="small">persist</text>
  <text x="820" y="470" class="small">optional bridge</text>
</svg>

