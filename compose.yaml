services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3002
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3002:3002"
    restart: unless-stopped

  frontend:
    build:
      context: .
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3001
      PROXY_TARGET: http://backend:3002
    depends_on:
      - backend
    ports:
      - "3001:3001"
    restart: unless-stopped

